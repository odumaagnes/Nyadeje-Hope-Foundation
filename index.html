<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Nyadeje Hope Foundation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: { DEFAULT: '#C5A059', light: '#DCC287', dark: '#A68545' },
                        natural: { 50: '#F9F8F6', 100: '#F2EFE9', 900: '#2A2A2A' },
                        warm: { 50: '#FFFDF7', 100: '#FFF8E7' }
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        serif: ['Playfair Display', 'serif']
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes fadein {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeinLeft {
            0% { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeinRight {
            0% { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        @keyframes scaleIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse-gold {
            0%, 100% { box-shadow: 0 0 0 0 rgba(197, 160, 89, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(197, 160, 89, 0); }
        }
        @keyframes whatsapp-pulse {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
            70% { box-shadow: 0 0 0 14px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-fadein { animation: fadein 1s ease-out forwards; }
        .animate-fadein-left { animation: fadeinLeft 1s ease-out forwards; }
        .animate-fadein-right { animation: fadeinRight 1s ease-out forwards; }
        .animate-scale-in { animation: scaleIn 0.8s ease-out forwards; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-pulse-gold { animation: pulse-gold 2s ease-in-out infinite; }
        .animate-spin { animation: spin 1s linear infinite; }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }
        .delay-500 { animation-delay: 0.5s; }
        .delay-600 { animation-delay: 0.6s; }
        .opacity-0-init { opacity: 0; }
        .scroll-animate { opacity: 0; transform: translateY(20px); transition: all 0.8s ease-out; }
        .scroll-animate.visible { opacity: 1; transform: translateY(0); }
        .scroll-animate-left { opacity: 0; transform: translateX(-30px); transition: all 0.8s ease-out; }
        .scroll-animate-left.visible { opacity: 1; transform: translateX(0); }
        .scroll-animate-right { opacity: 0; transform: translateX(30px); transition: all 0.8s ease-out; }
        .scroll-animate-right.visible { opacity: 1; transform: translateX(0); }
        html { scroll-behavior: smooth; }
        body { font-family: 'Montserrat', sans-serif; }
        .hero-overlay { background: linear-gradient(to bottom, rgba(42,42,42,0.5), rgba(42,42,42,0.3), rgba(42,42,42,0.7)); }
        .card-hover { transition: all 0.5s ease; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
        .img-hover { overflow: hidden; }
        .img-hover img { transition: all 0.8s ease; filter: grayscale(15%); }
        .img-hover:hover img { transform: scale(1.03); filter: grayscale(0); }
        .nav-blur { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .value-card { transition: all 0.3s ease; }
        .value-card:hover { border-color: rgba(197,160,89,0.5); background: rgba(197,160,89,0.05); }
        .stat-number { background: linear-gradient(135deg, #C5A059, #DCC287); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .donation-card { transition: all 0.4s ease; border: 1px solid rgba(0,0,0,0.05); }
        .donation-card:hover { border-color: rgba(197,160,89,0.4); transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
        .toast { transform: translateY(100px); opacity: 0; transition: all 0.4s ease; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .objective-item { transition: all 0.4s ease; }
        .objective-item:hover { background: rgba(197,160,89,0.03); }
        .objective-item:hover .obj-number { background: #C5A059; color: #fff; }
        .whatsapp-float { animation: whatsapp-pulse 2s infinite; }
        .whatsapp-float:hover { animation: none; transform: scale(1.1); }
        .passport-frame {
            border: 3px solid rgba(197,160,89,0.3);
            box-shadow: 0 8px 30px rgba(0,0,0,0.08), inset 0 0 0 6px white, inset 0 0 0 7px rgba(197,160,89,0.15);
            transition: all 0.5s ease;
        }
        .gallery-filter-btn { transition: all 0.3s ease; }
        .gallery-filter-btn.active { background: #C5A059; color: #fff; border-color: #C5A059; }
        .gallery-item { transition: all 0.5s ease; }
        .gallery-item.hidden-item { opacity: 0; transform: scale(0.8); position: absolute; pointer-events: none; }
        .gallery-item.visible-item { opacity: 1; transform: scale(1); position: relative; pointer-events: auto; }
        .gallery-thumb { overflow: hidden; cursor: pointer; }
        .gallery-thumb img { transition: all 0.6s ease; filter: grayscale(10%); }
        .gallery-thumb:hover img { transform: scale(1.05); filter: grayscale(0); }
        .gallery-thumb .thumb-overlay { opacity: 0; transition: all 0.4s ease; }
        .gallery-thumb:hover .thumb-overlay { opacity: 1; }
        .lightbox { opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .lightbox.active { opacity: 1; pointer-events: auto; }
        .lightbox.active .lightbox-content { transform: scale(1); }
        .lightbox-content { transform: scale(0.95); transition: transform 0.3s ease; }
        .video-play-btn { transition: all 0.3s ease; }
        .gallery-thumb:hover .video-play-btn { transform: scale(1.1); }

        .passport-frame:hover {
            border-color: rgba(197,160,89,0.5);
            box-shadow: 0 12px 40px rgba(0,0,0,0.12), inset 0 0 0 6px white, inset 0 0 0 7px rgba(197,160,89,0.3);
            transform: translateY(-2px);
        }
        .passport-placeholder {
            background: linear-gradient(135deg, #f5f0e8 0%, #ebe4d6 50%, #f5f0e8 100%);
            background-size: 200% 200%;
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .founder-badge {
            background: linear-gradient(135deg, rgba(197,160,89,0.08) 0%, rgba(197,160,89,0.03) 100%);
            border: 1px solid rgba(197,160,89,0.15);
        }
    </style>
</head>
<body class="bg-white text-natural-900 font-light">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
